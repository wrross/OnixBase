<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnixBase - Bom Dia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      color: #f8fafc;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: float 14s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 480px;
      height: 480px;
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      bottom: -120px;
      right: -100px;
      animation-duration: 18s;
      animation-delay: -5s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(60px, 40px) scale(1.1);
      }
    }

    /* Glassmorphism Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 3.5rem 3rem;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: fadeIn 1s ease-out;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #c7d2fe;
      margin-bottom: 1.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 70%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .sun-icon {
      display: inline-block;
      margin-left: 8px;
      filter: drop-shadow(0 0 16px rgba(251, 191, 36, 0.6));
      animation: spinSlow 20s linear infinite;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    p {
      color: #94a3b8;
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    .time-display {
      font-variant-numeric: tabular-nums;
      font-size: 1.5rem;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.5);
      padding: 0.6rem 1.4rem;
      border-radius: 14px;
      display: inline-block;
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 1.5rem;
    }

    .footer-note {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 1rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Projeto OnixBase</span>
    </div>
    <h1>Bom dia! <span class="sun-icon">☀️</span></h1>
    <p>Tenha um dia extraordinário e repleto de grandes realizações.</p>
    
    <div class="time-display" id="clock">00:00:00</div>

    <div class="footer-note">
      Hospedado com sucesso via GitHub Pages / OnixBase
    </div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const clockEl = document.getElementById('clock');
      if (clockEl) {
        clockEl.textContent = `${hours}:${minutes}:${seconds}`;
      }
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
